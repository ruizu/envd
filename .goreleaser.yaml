# GoReleaser configuration for envd.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: envd
    main: .
    binary: envd
    env:
      - CGO_ENABLED=0
    # Stamp version metadata into the variables defined in internal/cli.
    ldflags:
      - -s -w
      - -X github.com/ruizu/envd/internal/cli.version={{ .Version }}
      - -X github.com/ruizu/envd/internal/cli.commit={{ .Commit }}
      - -X github.com/ruizu/envd/internal/cli.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Windows on arm64 is uncommon; drop it to keep the matrix lean.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: envd
    ids:
      - envd
    # Produce e.g. envd_v1.2.3_linux_amd64.tar.gz (zip on Windows).
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  # Publish to the GitHub repo. owner/name are pinned so the config validates
  # independent of the local git remote; adjust if the repository moves.
  github:
    owner: ruizu
    name: envd
  draft: false
  prerelease: auto
